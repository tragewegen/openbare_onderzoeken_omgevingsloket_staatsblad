
<!DOCTYPE html>

<body>
<div id="sidebar">

        <div class="btn-follow-container">
            <button class="btn-follow" onclick="followThisPage()">

    </div>
    <div id="content-area"><div class="section-title">Omgevingsonderzoeken</div>

</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map').setView([50.9, 4.4], 9);
    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OSM' }).addTo(map);
    const resultLayer = L.layerGroup().addTo(map);

    // WMS Configuratie (Provincie Vlaams-Brabant)
    const trageWegenBrabant = L.tileLayer.wms('https://geoservices.vlaamsbrabant.be/TrageWegen/MapServer/WMSServer', {
        layers: '0', 
        format: 'image/png',
        transparent: true,
        version: '1.1.1',
        attribution: '© Provincie Vlaams-Brabant'
    });

    const overlays = {
        "Dossiers en Wegen": resultLayer,
        "Tragewegenregister": trageWegenBrabant
    };
    L.control.layers(null, overlays).addTo(map);

    function followThisPage() {
        const currentUrl = window.location.href;
        const followUrl = "https://www.followthatpage.com/add?url=" + encodeURIComponent(currentUrl);
        navigator.clipboard.writeText(currentUrl).then(() => {
            window.open(followUrl, '_blank');
        });
    }

const DATA_WEGEN = {"type": "FeatureCollection", "name": "matches_wegen", "crs": {"type": "name", "properties": {"name": "urn:ogc:def:crs:OGC:1.3:CRS84"}}, "features": [{"type": "Feature", "properties": {"gml_id": "F_TrageWegen.23883", "OBJECTID": 23883, "WS_OIDN": 1006105.0, "LBLSTATUS": "in gebruik", "LBLMORF": "weg bestaande uit \u00e9\u00e9n rijbaan", "LBLWEGCAT": "niet gekend", "LSTRNM": "Boechoutveldweg", "RSTRNM": "Boechoutveldweg", "LBLBEHEER": "Gemeente Boechout", "WV_LBLTYPE": "weg met vaste verharding", "WB_BREEDTE": -8.0, "TRAGE_WEG": 1, "TW_ID": "29901", "TW_BREEDTE": 1, "TW_EIGENAAR": -8, "TW_DAT_INVENTARISATIE": "2008-11-07T00:00:00", "TW_JUR_STATUUT": 2, "TW_ZICHTBAAR": 1, "TW_NIET_ZB_REDEN": -9, "TW_TOEGANKELIJK": 1, "TW_NIET_TG_REDEN": -9, "TW_VERHARDING": 10, "Shape_Length": 199.44829926, "TW_ABW": "VRE_33_1", "TW_NAAM": "Boechoutveldweg", "index_right": 8, "projectnummer": "2026108543"}, "geometry": {"type": "MultiLineString", "coordinates": [[[4.519487254083096, 51.17224136022871], [4.51941168198465, 51.17228343822146], [4.519374864010295, 51.17230429483944], [4.519356010394851, 51.17232334510307], [4.51934756217642, 51.17234297618074], [4.519268300786189, 51.17298401136216], [4.519237967709771, 51.17300387987501], [4.519151795048771, 51.17373077796764], [4.519142766125008, 51.173746485353924], [4.519111097999865, 51.17378124779436], [4.519104333548125, 51.17379505030057], [4.51910514382761, 51.17381169699041], [4.519120322330222, 51.17382547143531], [4.51914304633246, 51.173833052991476], [4.519176350585776, 51.17383681524819], [4.519295163768248, 51.173842846417415], [4.519356457231214, 51.173848546672595]]]}}]};
        

    window.onload = () => {
        resultLayer.clearLayers();

        if (typeof DATA_DOSSIERS !== 'undefined' && DATA_DOSSIERS && DATA_DOSSIERS.features) {
            const leafletGeo = L.geoJSON(DATA_DOSSIERS, {
                style: { color: '#3498db', weight: 2, fillOpacity: 0.3 },
                onEachFeature: (f, l) => {
                    const p = f.properties;
                    const nr = p.projectnummer || p.PROJECTNUMMER || 'N/A';
                    const naam = p.projectNaam || p.PROJECTNAAM || 'Geen naam';
                    const omschrijving = p.handeling_omschrijving || p.HANDELING_OMSCHRIJVING || '';
                    const url = p.loket_url || p.LOKET_URL || '#';

                    l.bindPopup(`
                        <div style="font-size: 13px; line-height: 1.4;">
                            <strong>Project: ${nr}</strong><br>
                            <b>Naam:</b> ${naam}<br>
                            ${omschrijving ? `<b>Handeling:</b> ${omschrijving}<br>` : ''}
                            <hr style="margin: 8px 0;">
                            <a href="${url}" target="_blank" style="color: #3498db; font-weight: bold; text-decoration: none;">Open Omgevingsloket -></a>
                        </div>
                    `);
                }
            }).addTo(resultLayer);
            if (DATA_DOSSIERS.features.length > 0) map.fitBounds(leafletGeo.getBounds());
            window.currentLayers = leafletGeo;
        }

        if (typeof DATA_WEGEN !== 'undefined' && DATA_WEGEN && DATA_WEGEN.features) {
            L.geoJSON(DATA_WEGEN, { 
                style: { color: '#e74c3c', weight: 3, dashArray: '5, 5' },
                onEachFeature: (f, l) => {
                    const p = f.properties;
                    let rawJur = p.TW_JUR_STATUUT || p.tw_jur_statuut;
                    let jurInfo = (rawJur == 2 || rawJur == "2") ? "weg met rooilijn" : "feitelijke weg";
                    let abwVal = p.TW_ABW || p.tw_abw || "Geen info";

                    l.bindPopup(`
                        <div style="font-size: 13px;">
                            <b>Wegsegment</b><br>
                            <b>weginfo:</b> ${jurInfo}<br>
                            <b>Atlas der Buurtwegen:</b> ${abwVal}
                        </div>
                    `);
                }
            }).addTo(resultLayer);
        }
    };

    function zoomToFeature(id) {
        if (!window.currentLayers) return;
        window.currentLayers.eachLayer(layer => {
            const p = layer.feature.properties;
            if ((p.projectnummer || p.PROJECTNUMMER) == id) {
                if (typeof layer.getBounds === 'function') {
                    map.setView(layer.getBounds().getCenter(), 17);
                } else if (typeof layer.getLatLng === 'function') {
                    map.setView(layer.getLatLng(), 17);
                }
                layer.openPopup();
            }
        });
    }
</script>
