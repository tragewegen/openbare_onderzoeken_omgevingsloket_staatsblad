
<!DOCTYPE html>

    <style>
        body { display: flex; height: 100vh; margin: 0; font-family: 'Segoe UI', sans-serif; overflow: hidden; background-color: #f0f0f0; }

            background-color: #27ae60; 
            color: white; 
            border: none;

            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 0.85rem;

        .card-omgeving { border-left-color: #3498db; cursor: pointer; transition: transform 0.1s; }

        .card-staatsblad { border-left-color: #e67e22; }

        .card p { margin: 3px 0; font-size: 0.85rem; color: #555; line-height: 1.3; }

        .btn-link { display: inline-block; margin-top: 8px; color: #3498db; text-decoration: none; font-weight: bold; font-size: 0.8rem; }

</head>
<body>
<div id="sidebar">

        <div class="btn-follow-container">

    <div id="content-area"><div class="section-title">Omgevingsonderzoeken</div>

</div>
<div id="map"></div>

<script>
    const map = L.map('map').setView([50.9, 4.4], 9);
    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OSM' }).addTo(map);
    const resultLayer = L.layerGroup().addTo(map);

    // WMS Configuratie (Provincie Vlaams-Brabant)
    const trageWegenBrabant = L.tileLayer.wms('https://geoservices.vlaamsbrabant.be/TrageWegen/MapServer/WMSServer', {
        layers: '0', 
        format: 'image/png',
        transparent: true,
        version: '1.1.1',
        attribution: '© Provincie Vlaams-Brabant'
    });

    const overlays = {
        "Dossiers en Wegen": resultLayer,
        "Tragewegenregister": trageWegenBrabant
    };
    L.control.layers(null, overlays).addTo(map);

    function followThisPage() {
        const currentUrl = window.location.href;
        const followUrl = "https://www.followthatpage.com/add?url=" + encodeURIComponent(currentUrl);
        navigator.clipboard.writeText(currentUrl).then(() => {
            window.open(followUrl, '_blank');
        });
    }

const DATA_WEGEN = {"type": "FeatureCollection", "name": "matches_wegen", "crs": {"type": "name", "properties": {"name": "urn:ogc:def:crs:OGC:1.3:CRS84"}}, "features": [{"type": "Feature", "properties": {"gml_id": "F_TrageWegen.41797", "OBJECTID": 41797, "WS_OIDN": 0.0, "LBLSTATUS": "buiten gebruik", "LBLMORF": null, "LBLWEGCAT": null, "LSTRNM": null, "RSTRNM": null, "LBLBEHEER": null, "WV_LBLTYPE": null, "WB_BREEDTE": null, "TRAGE_WEG": 1, "TW_ID": "71016_3514", "TW_BREEDTE": -8, "TW_EIGENAAR": -8, "TW_DAT_INVENTARISATIE": "2015-07-09T00:00:00", "TW_JUR_STATUUT": 2, "TW_ABW": "Gen_13_1", "TW_NAAM": null, "TW_ZICHTBAAR": 2, "TW_NIET_ZB_REDEN": -8, "TW_TOEGANKELIJK": 2, "TW_NIET_TG_REDEN": -8, "TW_VERHARDING": -8, "Shape_Length": 1132.24593804, "index_right": 3, "projectnummer": "2026043664"}, "geometry": {"type": "MultiLineString", "coordinates": [[[5.487137456046865, 50.9358319771465], [5.486499975097158, 50.93499929776239], [5.485684661011778, 50.93401532134965], [5.485318283613163, 50.93360858821768], [5.485091177831127, 50.93335830616831], [5.484338714198434, 50.9329146694164], [5.4838400647667, 50.93264442496673], [5.483504491031534, 50.93233205890844], [5.483365341255452, 50.93218011232306], [5.483181365603763, 50.93194294042224], [5.48215424756862, 50.9301450222378], [5.481983371811702, 50.92985813819365], [5.481958660927517, 50.929718628068905], [5.481906777453759, 50.92933594951682], [5.481929526550803, 50.92909230777852], [5.482079676936329, 50.92880688655319], [5.482090409636544, 50.928658024836345], [5.482066018636345, 50.92853203487662], [5.481991977841996, 50.92844141876301], [5.48196249275882, 50.92836149937252], [5.481921788687918, 50.928251165139976], [5.481824350738376, 50.92801966513436], [5.481727504651007, 50.92781306169211], [5.481602230290443, 50.9275154193299], [5.48128662105147, 50.926945651170335], [5.481227597942837, 50.92667228282675]]]}}]};
        

    window.onload = () => {
        resultLayer.clearLayers();

        if (typeof DATA_DOSSIERS !== 'undefined' && DATA_DOSSIERS && DATA_DOSSIERS.features) {
            const leafletGeo = L.geoJSON(DATA_DOSSIERS, {
                style: { color: '#3498db', weight: 2, fillOpacity: 0.3 },
                onEachFeature: (f, l) => {
                    const p = f.properties;
                    const nr = p.projectnummer || p.PROJECTNUMMER || 'N/A';
                    const naam = p.projectNaam || p.PROJECTNAAM || 'Geen naam';
                    const omschrijving = p.handeling_omschrijving || p.HANDELING_OMSCHRIJVING || '';
                    const url = p.loket_url || p.LOKET_URL || '#';

                    l.bindPopup(`
                        <div style="font-size: 13px; line-height: 1.4;">
                            <strong>Project: ${nr}</strong><br>
                            <b>Naam:</b> ${naam}<br>
                            ${omschrijving ? `<b>Handeling:</b> ${omschrijving}<br>` : ''}
                            <hr style="margin: 8px 0;">
                            <a href="${url}" target="_blank" style="color: #3498db; font-weight: bold; text-decoration: none;">Open Omgevingsloket -></a>
                        </div>
                    `);
                }
            }).addTo(resultLayer);
            if (DATA_DOSSIERS.features.length > 0) map.fitBounds(leafletGeo.getBounds());
            window.currentLayers = leafletGeo;
        }

        if (typeof DATA_WEGEN !== 'undefined' && DATA_WEGEN && DATA_WEGEN.features) {
            L.geoJSON(DATA_WEGEN, { 
                style: { color: '#e74c3c', weight: 3, dashArray: '5, 5' },
                onEachFeature: (f, l) => {
                    const p = f.properties;
                    let rawJur = p.TW_JUR_STATUUT || p.tw_jur_statuut;
                    let jurInfo = (rawJur == 2 || rawJur == "2") ? "weg met rooilijn" : "feitelijke weg";
                    let abwVal = p.TW_ABW || p.tw_abw || "Geen info";

                    l.bindPopup(`
                        <div style="font-size: 13px;">
                            <b>Wegsegment</b><br>
                            <b>weginfo:</b> ${jurInfo}<br>
                            <b>Atlas der Buurtwegen:</b> ${abwVal}
                        </div>
                    `);
                }
            }).addTo(resultLayer);
        }
    };

    function zoomToFeature(id) {
        if (!window.currentLayers) return;
        window.currentLayers.eachLayer(layer => {
            const p = layer.feature.properties;
            if ((p.projectnummer || p.PROJECTNUMMER) == id) {
                if (typeof layer.getBounds === 'function') {
                    map.setView(layer.getBounds().getCenter(), 17);
                } else if (typeof layer.getLatLng === 'function') {
                    map.setView(layer.getLatLng(), 17);
                }
                layer.openPopup();
            }
        });
    }
</script>
